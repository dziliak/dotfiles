# BEGIN_KITTY_FONTS
font_family      postscript_name=JetBrainsMonoNFM
# END_KITTY_FONTS
font_size 14.0
# text_composition_strategy 1.5 0

# Increase cell height by 15%
modify_font cell_height 100%
modify_font cell_width 100%

# 0 = off; ms the cursor must sit still before a trail shows
cursor_trail 3
# fastest / slowest fade time in seconds
cursor_trail_decay 0.2 0.5
# min distance (in cells) the cursor must move to draw a trail
cursor_trail_start_threshold 2

scrollback_lines 10000
scrollback_pager_history_size 50

background_opacity 0.9
background_blur 8

macos_option_as_alt left

# Enable split layouts
enabled_layouts splits

# Horizontal split (top/bottom)
map cmd+enter launch --location=hsplit --cwd=current

# Vertical split (left/right)
map cmd+shift+enter launch --location=vsplit --cwd=current

# Rotate split 90° (horizontal ↔ vertical)
map cmd+shift+r layout_action rotate

# Rotate split 180° (swap pane positions)
map cmd+shift+e layout_action rotate 180

# Rotate split 270° (change orientation and swap positions)
map cmd+shift+t layout_action rotate 270

# Navigate panes with 󰘳 + 󰘵 + 
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
